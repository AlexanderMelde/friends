<div class="events-list">
  <app-section-header 
    icon="event"
    [title]="title">
  </app-section-header>
  <div *ngFor="let event of events">
    <app-event-list-item 
      [event]="event" 
      [showEditButton]="true"
      (editEventClicked)="editEvent($event)">
    </app-event-list-item>
  </div>
</div>
