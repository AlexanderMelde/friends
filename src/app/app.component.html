<div class="app-container" 
     (document:dragleave)="onDocumentDragLeave($event)">
  <mat-toolbar color="primary">
    <span style="cursor: pointer;" (click)="graphService.selectNode(null); graphService.selectLink(null); closeAllSidebars()" >{{ title }}</span>
    <span class="toolbar-spacer"></span>

    <button mat-icon-button (click)="toggleCalendarSidebar()" matTooltip="Calendar">
      <mat-icon>event_note</mat-icon>
    </button>
    <button mat-icon-button (click)="toggleFriendsSidebar()" matTooltip="Friends">
      <mat-icon>people</mat-icon>
    </button>
    
    <!-- Overflow Menu -->
    <button mat-icon-button [matMenuTriggerFor]="overflowMenu" matTooltip="More options">
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #overflowMenu="matMenu">
      <button mat-menu-item (click)="openHelp()">
        <mat-icon>help_outline</mat-icon>
        <span>Help</span>
      </button>
      <button mat-menu-item (click)="openSettings()">
        <mat-icon>settings</mat-icon>
        <span>Settings</span>
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="openLegal()">
        <mat-icon>info</mat-icon>
        <span>Imprint & Privacy</span>
      </button>
    </mat-menu>
  </mat-toolbar>
  
  <div class="main-content" cdkDropListGroup>
    <div class="content-container" 
         [class.calendar-sidebar-open]="uiStateService.calendarSidebarOpen() && !uiStateService.friendsSidebarOpen()"
         [class.friends-sidebar-open]="uiStateService.friendsSidebarOpen() && !uiStateService.calendarSidebarOpen()"
         [class.both-sidebars-open]="uiStateService.bothSidebarsOpen()"
         [class.overlay-active]="uiStateService.isOverlayActive()">
      <app-graph-visualization></app-graph-visualization>
    </div>
    
    <!-- Desktop Sidebars -->
    <app-calendar-sidebar 
      [isOpen]="uiStateService.calendarSidebarOpen()" 
      [friendsSidebarOpen]="uiStateService.friendsSidebarOpen()"
      (closeRequested)="uiStateService.closeCalendarSidebar()"
      (addEventRequested)="addEvent()"
      class="desktop-sidebar">
    </app-calendar-sidebar>
    
    <app-friends-sidebar 
      [isOpen]="uiStateService.friendsSidebarOpen()" 
      [calendarSidebarOpen]="uiStateService.calendarSidebarOpen()"
      (closeRequested)="uiStateService.closeFriendsSidebar()"
      (addFriendRequested)="addFriend()"
      class="desktop-sidebar">
    </app-friends-sidebar>

    <!-- Mobile Overlay -->
    <div class="mobile-overlay" 
         [class.active]="uiStateService.isOverlayActive()"
         (click)="onOverlayBackdropClick($event)">
      <div class="overlay-content" 
           [class.slide-in]="uiStateService.isOverlayActive()"
           (click)="$event.stopPropagation()">
        
        <!-- Calendar Overlay Content -->
        <div *ngIf="uiStateService.calendarSidebarOpen()" class="overlay-sidebar">
          <app-calendar-sidebar 
            [isOpen]="true" 
            [friendsSidebarOpen]="false"
            (closeRequested)="uiStateService.closeCalendarSidebar()"
            (addEventRequested)="addEvent()"
            class="mobile-sidebar">
          </app-calendar-sidebar>
        </div>

        <!-- Friends Overlay Content -->
        <div *ngIf="uiStateService.friendsSidebarOpen()" class="overlay-sidebar">
          <app-friends-sidebar 
            [isOpen]="true" 
            [calendarSidebarOpen]="false"
            (closeRequested)="uiStateService.closeFriendsSidebar()"
            (addFriendRequested)="addFriend()"
            class="mobile-sidebar">
          </app-friends-sidebar>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Overlay Backdrop -->
  <div class="overlay-backdrop" 
       [class.active]="uiStateService.isOverlayActive()"
       (click)="closeAllSidebars()"></div>

  <!-- Trash Bin Component -->
  <app-trash-bin></app-trash-bin>
</div>
